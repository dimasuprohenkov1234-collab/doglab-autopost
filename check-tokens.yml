name: Проверка токенов

# Запускайте вручную после настройки (Actions → «Проверка токенов» → Run workflow).
# Ничего не публикует — только проверяет, что доступы к Instagram и Threads работают.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить доступ
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          OK=1
          if [ -z "$IG_TOKEN" ]; then echo "::error::Нет секрета IG_TOKEN"; OK=0
          else
            R=$(curl -s "https://graph.instagram.com/v25.0/me?fields=user_id,username,account_type&access_token=$IG_TOKEN")
            echo "Instagram: $R"
            echo "$R" | grep -q '"username"' || { echo "::error::Instagram-токен не работает (см. ответ выше)"; OK=0; }
          fi
          if [ -z "$THREADS_TOKEN" ]; then echo "::error::Нет секрета THREADS_TOKEN"; OK=0
          else
            R=$(curl -s "https://graph.threads.net/v1.0/me?fields=id,username&access_token=$THREADS_TOKEN")
            echo "Threads: $R"
            echo "$R" | grep -q '"username"' || { echo "::error::Threads-токен не работает (см. ответ выше)"; OK=0; }
          fi
          # проверка, что картинки репозитория доступны публично (нужно для Meta)
          URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/posts/01_5_oshibok/01.jpg"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [ "$CODE" = "200" ]; then echo "Картинки доступны публично: OK"
          else echo "::error::Картинки недоступны ($CODE). Репозиторий должен быть Public."; OK=0; fi
          [ $OK = 1 ] && echo "✅ Всё готово к публикации" || exit 1
