name: Публикация постов

on:
  schedule:
    - cron: "7 * * * *"      # каждый час в :07 (UTC)
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска
    inputs:
      only:
        description: "Опубликовать конкретный пост прямо сейчас (id папки, например 01_5_oshibok). Пусто — по расписанию."
        required: false
        default: ""
      dry_run:
        description: "Только проверить, ничего не публиковать"
        type: boolean
        default: false

permissions:
  contents: write             # чтобы сохранить published.json

concurrency:
  group: publish              # два запуска одновременно не пойдут — защита от дублей
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Публикация
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python publisher/publish.py "${ARGS[@]}"

      - name: Сохранить отметки об опубликованных постах
        if: always()
        run: |
          if [ -n "$(git status --porcelain published.json)" ]; then
            git config user.name  "autopost-bot"
            git config user.email "autopost-bot@users.noreply.github.com"
            git add published.json
            git commit -m "Опубликовано: обновление published.json"
            git push
          fi
